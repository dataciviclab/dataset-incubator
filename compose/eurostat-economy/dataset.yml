root: "../../out"
schema_version: 1

dataset:
  name: "economy"
  source_id: "eurostat"
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_area_nuts3"
      type: "http_file"
      args:
        url: "https://storage.googleapis.com/dataciviclab-clean/eurostat/eurostat_area_nuts3/eurostat_area_nuts3_2026_clean.parquet"
        filename: "hub.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
  validate:
    min_rows: 10000
    promotion:
      max_row_drop_pct: 100

mart:
  tables:
    - name: "mart_it_nuts3"
      sql: "sql/mart_it_nuts3.sql"
  validate:
    table_rules:
      mart_it_nuts3: { min_rows: 100 }

validation:
  fail_on_error: true
