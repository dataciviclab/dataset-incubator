root: "../../out"
schema_version: 1

dataset:
  name: "elezioni_voto"
  source_id: "dataciviclab_composite"
  tags: [politica, elezioni, voto]
  category: politica
  years: [2026]
  time_coverage:
    mode: full_series
    start_year: 1979
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "elezioni_comunali"
      type: "http_file"
      args:
        url: "https://storage.googleapis.com/dataciviclab-clean/elezioni_comunali/2024/elezioni_comunali_2024_clean.parquet"
        filename: "hub.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
  validate:
    min_rows: 10000
    promotion:
      max_row_drop_pct: 100

mart:
  tables:
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
    - name: "mart_liste"
      sql: "sql/mart_liste.sql"
  validate:
    table_rules:
      mart_sintesi: { min_rows: 100 }
      mart_trend: { min_rows: 10 }
      mart_liste: { min_rows: 100 }

validation:
  fail_on_error: true
