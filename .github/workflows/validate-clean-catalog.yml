name: Validate Clean Catalog

on:
  pull_request:
    paths:
      - "registry/registry.json"
  push:
    branches:
      - main
    paths:
      - "registry/registry.json"
  workflow_dispatch:

jobs:
  validate-clean-catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history per git show HEAD~1 nei passaggi notify
      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: mcp>=1.26.0 duckdb==1.5.1

      # Validate catalog structure (schema + contract) — sempre
      - name: Validate catalog structure
        run: toolkit registry build

      # Notifiche downstream — su push a main (dopo merge registry PR)
      # Notifica DE per qualsiasi modifica al catalogo (nuovo slug OPPURE aggiornamento)
      - name: Notify data-explorer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.LAB_OPS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/dataciviclab/data-explorer/dispatches \
            -d '{"event_type":"catalog_updated"}'
          echo "data-explorer dispatch inviato (catalog_updated)"

      # Rileva nuovi slug per creare issue di follow-up (solo per slug inediti)
      - name: Detect new slugs
        id: detect
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python - <<'PY'
          import json, os, subprocess

          r = subprocess.run(
              ["git", "show", "HEAD~1:registry/registry.json"],
              capture_output=True, text=True
          )
          old_slugs = set()
          if r.returncode == 0:
              old = json.loads(r.stdout)
              old_slugs = {e["slug"] for e in old.get("datasets", []) if "slug" in e}

          with open("registry/registry.json") as f:
              new = json.load(f)
          new_slugs = {e["slug"] for e in new.get("datasets", []) if "slug" in e}

          added = new_slugs - old_slugs
          # Solo i candidate generano issue DE/DCL — i support vengono filtrati via
          items = []
          for s in sorted(added):
              dir_name = s.replace("_", "-")
              if not os.path.exists(f"support_datasets/{dir_name}/dataset.yml"):
                  items.append({"slug": s, "root": "candidates"})
          result = json.dumps(items)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"new_slugs={result}\n")

          if added:
              print(f"Nuovi slug: {', '.join(sorted(added))}")
          PY

      - name: Open follow-up issue in data-explorer
        if: always() && steps.detect.outputs.new_slugs != '' && fromJSON(steps.detect.outputs.new_slugs)[0] != null
        env:
          GH_TOKEN: ${{ secrets.LAB_OPS_TOKEN }}
          PR_NUMBER: ""
          PR_TITLE: "merge in main@${{ github.sha }}"
          ITEMS_JSON: ${{ steps.detect.outputs.new_slugs }}
          REPO: "dataciviclab/data-explorer"
        run: python scripts/create_issue.py

      - name: Open analysis issue in dataciviclab
        if: always() && steps.detect.outputs.new_slugs != '' && fromJSON(steps.detect.outputs.new_slugs)[0] != null
        env:
          GH_TOKEN: ${{ secrets.LAB_OPS_TOKEN }}
          PR_NUMBER: ""
          PR_TITLE: "merge in main@${{ github.sha }}"
          ITEMS_JSON: ${{ steps.detect.outputs.new_slugs }}
          REPO: "dataciviclab/dataciviclab"
        run: python scripts/create_issue.py
