# PR check — preflight dei dataset in candidates/compose/support_datasets
#
# ADR-001: workflow orchestratore, logica nei componenti condivisi.
# Il preflight (config valida + fonte raggiungibile + quality score) è
# delegato al reusable `dataset-config-check-reusable`. Il run completo
# avviene post-merge (pipeline.yml).

name: PR check

on:
  pull_request:
    paths:
      - "candidates/**"
      - "compose/**"
      - "support_datasets/**"

jobs:
  validate-config:
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      install: "pip install -r requirements.txt"
      globs: "candidates compose support_datasets"
      years: "from-config"
