# Post-merge pipeline — dataset-incubator
#
# Dopo il merge di una PR che tocca candidate/compose/support_datasets:
#   1. detect dei dataset cambiati (action condivisa)
#   2. run (toolkit, anni dal config) via `make run-batch`
#   3. sync GCS (clean + mart) via WIF
#   4. registry → draft PR (composite action registry-update-pr)
#
# Tutta la logica sta in `pipeline-reusable.yml` e nei target del Makefile
# (ADR-001). Questo file è solo l'orchestratore.
#
# ADR-002: `datasets` accetta uno o più slug separati da virgola; vuoto = tutti.

name: Post-merge pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "candidates/**"
      - "compose/**"
      - "support_datasets/**"
  workflow_dispatch:
    inputs:
      datasets:
        description: "Uno o più slug separati da virgola (o path del dataset.yml). Vuoto = tutti. Vedi ADR-002."
        required: false
        default: ""

concurrency:
  group: post-merge-pipeline-${{ github.event.pull_request.number || github.ref || 'dispatch' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "dataset-incubator"
      # I candidate pubblicano alla RADICE del bucket
      # (gs://dataciviclab-{clean,mart}/<slug>/<anno>/), non sotto un prefisso
      # di repo come gli altri repo dati. Stringa vuota = nessun prefisso.
      sync-prefix: ""
      detect-paths: "candidates compose support_datasets"
      run-command: >-
        ${{ inputs.datasets == '' && 'make run-all'
            || format('for d in $(echo "{0}" | tr "," " "); do toolkit run -c "$d" || echo "⚠️  run fallito (skip): $d"; done', inputs.datasets) }}
      run-batch-command: "make run-batch"
      # Alcuni candidate scaricano via script (non http_file): serve il flag.
      extra-env: "TOOLKIT_ALLOW_SCRIPT_SOURCE=1"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
