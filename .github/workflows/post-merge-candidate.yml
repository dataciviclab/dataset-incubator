# Post-merge pipeline — dataset-incubator
#
# Dopo il merge di una PR che tocca candidate/compose/support_datasets:
#   1. run dei dataset cambiati (toolkit, anni dal config)
#   2. sync GCS (clean + mart) via gcs-auth
#   3. registry → draft PR (composite action registry-update-pr, nello
#      stesso job del run — il registry deriva le entry dai parquet locali)
#
# Modello ADR-001 (pattern rna-aiuti-stato / eurostat): workflow orchestratore,
# logica nei componenti condivisi.

name: Post-merge pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "candidates/**"
      - "compose/**"
      - "support_datasets/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug del dataset da processare (es. inpa-bandi)"
        required: false
        type: string

concurrency:
  group: post-merge-pipeline-${{ github.event.pull_request.number || github.ref || 'dispatch' }}
  cancel-in-progress: false

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: -e ".[dev]"

      # ── Determinare i dataset da processare ─────────────────────────
      # gh diff: stessi path degli altri repo (candidates == datasets).
      # Su workflow_dispatch con slug esplicito: solo quel dataset.
      - name: Detect changed dataset dirs
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SLUG_INPUT: ${{ inputs.slug }}
        run: |
          if [ -n "$SLUG_INPUT" ]; then
            for base in candidates compose support_datasets; do
              [ -f "$base/$SLUG_INPUT/dataset.yml" ] && echo "$base/$SLUG_INPUT" >> changed_dirs.txt
            done
          else
            gh pr view "$PR_NUMBER" --json files --jq ".files[].path" | \
              grep -E '^(candidates|compose|support_datasets)/' | \
              grep -vE '\.(md|ipynb|png|jpg|jpeg|gif|svg)$' | \
              grep -vE '/(out|__pycache__)/' | \
              cut -d/ -f1-2 | sort -u > changed_dirs.txt
          fi
          # Filtra solo dir con dataset.yml
          DIRS=""
          while read -r d; do
            [ -n "$d" ] && [ -f "$d/dataset.yml" ] && DIRS="$DIRS $d"
          done < changed_dirs.txt
          if [ -n "$DIRS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$DIRS" > changed_dirs_final.txt
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Run pipeline (toolkit, anni dal config) ─────────────────────
      - name: Run changed datasets
        if: steps.detect.outputs.changed == 'true'
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"
        run: |
          for dir in $(cat changed_dirs_final.txt); do
            echo "=== $dir ==="
            toolkit run -c "$dir/dataset.yml" || echo "⚠️  run fallito (skip): $dir"
          done

      # ── GCS auth + sync (clean + mart) ──────────────────────────────
      # DI usa workload identity (non SA key) — flusso google-github-actions.
      - name: GCP Auth (workload identity)
        id: gcp
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.gcp.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync clean + mart to GCS
        if: steps.gcp.outcome == 'success' && steps.detect.outputs.changed == 'true'
        run: |
          for dir in $(cat changed_dirs_final.txt); do
            slug=$(grep '^  name:' "$dir/dataset.yml" | sed 's/.*: "//;s/"//')
            [ -z "$slug" ] && continue
            for year in $(ls "out/data/clean/$slug/" 2>/dev/null); do
              gsutil -m rsync -r -x ".*/_(run|validate)/.*" \
                "out/data/clean/$slug/$year/" "gs://dataciviclab-clean/$slug/$year/" \
                && echo "✅ $slug clean synced (anno $year)"
            done
            for year in $(ls "out/data/mart/$slug/" 2>/dev/null); do
              gsutil -m rsync -r \
                "out/data/mart/$slug/$year/" "gs://dataciviclab-mart/$slug/$year/" \
                && echo "✅ $slug mart synced (anno $year)"
            done
          done

      # ── Registry → draft PR (componente condiviso, stesso job) ──────
      - name: Registry update PR
        if: steps.detect.outputs.changed == 'true'
        uses: dataciviclab/.github/actions/registry-update-pr@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
