# Post-Merge Candidate Registry — dataset-incubator
#
# Pattern job unico (eurostat/dcl-bologna pipeline.yml): dopo il merge di una
# PR che tocca candidates/compose/support_datasets, o su workflow_dispatch:
#   1. detect — dir cambiate (slug manuale o diff della PR, esclusi doc-only)
#   2. run — run COMPLETO dei dataset cambiati (parquet + run record locali)
#   3. sync GCS — gsutil rsync dei parquet clean/mart
#   4. build_registry --write — registry.json (fusion ADR) dai parquet/run
#      appena generati (stesso runner → i run nuovi entrano subito)
#   5. PR draft "chore(post-merge)" col registry aggiornato (maintainer mergia)
#
# La CI NON committa su main: apre una PR draft col registry aggiornato.
# Un unico job garantisce che build_registry veda parquet e run record.

name: Post-Merge Candidate Registry

on:
  pull_request:
    types: [closed]
    paths:
      - "candidates/**"
      - "compose/**"
      - "support_datasets/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug del dataset da processare (es. inps-cig)"
        required: false
        type: string

concurrency:
  group: post-merge-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  DATACIVICLAB_WORKSPACE: ${{ github.workspace }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install toolkit + deps
        run: |
          pip install git+https://github.com/dataciviclab/toolkit.git
          pip install -e ".[dev]"

      - name: GCP Auth (for GCS push)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Detect changed dataset dirs
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SLUG_INPUT: ${{ inputs.slug }}
        run: |
          if [ -n "$SLUG_INPUT" ]; then
            # Prova candidates/, compose/, support_datasets/
            for base in candidates compose support_datasets; do
              [ -f "$base/$SLUG_INPUT/dataset.yml" ] && echo "$base/$SLUG_INPUT" >> changed_dirs.txt
            done
          else
            # File non-pipeline (README/notes/notebook/immagini/out) non
            # triggerano: una modifica a soli doc non deve rigenerare il registry.
            gh pr view "$PR_NUMBER" --json files --jq ".files[].path" | \
              grep -E '^(candidates|compose|support_datasets)/' | \
              grep -vE '\.(md|ipynb|png|jpg|jpeg|gif|svg)$' | \
              grep -vE '/(out|__pycache__)/' | \
              cut -d/ -f1-2 | sort -u > changed_dirs.txt
          fi
          # Filtra solo dir con dataset.yml
          DIRS=""
          while read -r d; do
            [ -n "$d" ] && [ -f "$d/dataset.yml" ] && DIRS="$DIRS $d"
          done < changed_dirs.txt
          if [ -n "$DIRS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$DIRS" > changed_dirs_final.txt
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run changed datasets (full)
        if: steps.detect.outputs.changed == 'true'
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"
        run: |
          YEAR=$(date +%Y)
          for dir in $(cat changed_dirs_final.txt); do
            echo "=== $dir ==="
            toolkit run -c "$dir/dataset.yml" --years $YEAR || echo "⚠️  run fallito (skip): $dir"
          done

      - name: Push changed datasets to GCS
        if: steps.detect.outputs.changed == 'true' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        run: |
          for dir in $(cat changed_dirs_final.txt); do
            slug=$(grep '^  name:' "$dir/dataset.yml" | sed 's/.*: "//;s/"//')
            [ -z "$slug" ] && continue
            for year in $(ls "out/data/clean/$slug/" 2>/dev/null); do
              gsutil -m rsync -r -x ".*/_(run|validate)/.*" \
                "out/data/clean/$slug/$year/" "gs://dataciviclab-clean/$slug/$year/" \
                && echo "✅ $slug clean synced (anno $year)"
            done
            for year in $(ls "out/data/mart/$slug/" 2>/dev/null); do
              gsutil -m rsync -r \
                "out/data/mart/$slug/$year/" "gs://dataciviclab-mart/$slug/$year/" \
                && echo "✅ $slug mart synced (anno $year)"
            done
          done

      - name: Build registry
        if: steps.detect.outputs.changed == 'true'
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"
        run: python scripts/build_registry.py --write

      - name: Check registry diff
        id: diff
        run: |
          if git diff --quiet -- registry/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft registry PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH="post-merge-candidate/pr-${PR_NUMBER}-registry"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"

          git add registry/
          git commit -m "chore(post-merge): aggiorna registry per PR #${PR_NUMBER}" || exit 0

          git push --force-with-lease -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "chore(post-merge): aggiorna registry per PR #${PR_NUMBER}" \
              --body "Registry artifacts updated after merge of #${PR_NUMBER} (datasets changed)." \
              --add-label post-merge
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(post-merge): aggiorna registry per PR #${PR_NUMBER}" \
              --body "Registry artifacts updated after merge of #${PR_NUMBER} (datasets changed)." \
              --label post-merge \
              --draft
          fi
