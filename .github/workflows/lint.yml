name: Lint

env:
  TOOLKIT_VERSION: "from-requirements-txt"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "requirements.txt"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "registry/**"
      - "candidates/**"
      - "compose/**"
      - "support_datasets/**"
      - "pyproject.toml"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: ruff mypy types-pyyaml types-requests pytest pytest-cov pytest-timeout mcp>=1.26.0 duckdb==1.5.1

      - name: Ruff
        run: ruff check scripts/ tools/

      - name: Mypy
        run: mypy scripts/ tools/

      - name: Pytest (scripts + MCP)
        run: python -m pytest tests/ -q --tb=line --cov=scripts --cov=tools/clean_query_mcp --cov-report=term --cov-fail-under=55

      - name: Smoke test clean-query MCP
        run: python -m tools.clean_query_mcp.scripts.smoke

      - name: Audit test markers
        shell: bash
        run: |
          for dir in tests; do
            dir="${dir%/}"
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              -- "$dir/test_*.py" "$dir/**/test_*.py" || true)
            if [ -z "$changed" ]; then
              echo "No test files changed in $dir/. OK."
              continue
            fi
            while IFS= read -r f; do
              fdir=$(dirname "$f")
              fbase=$(basename "$f")
              audit-test-markers "$fdir" --diff --files "$fbase"
            done <<< "$changed"
          done
