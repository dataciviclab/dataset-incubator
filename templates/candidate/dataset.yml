# ============================================================
# Template candidate — dataset-incubator
# Standard di riferimento: docs/candidate-standard.md
# Contratto campi completo: toolkit docs/config-schema.md
# ============================================================
root: "../../out"
schema_version: 1

dataset:
  name: "template_dataset"          # snake_case (^[a-z0-9_]+$)
  source_id: "ente_fonte"           # obbligatorio — id fonte in source-observatory
  tags: [tema, sotto-tema]          # obbligatorio — lista kebab-case descrittiva
  category: tema                    # obbligatorio — vedi candidate-standard.md App. A
  years: [2024]
  time_coverage:                    # raccomandato per serie storiche
    start_year: 2024
    end_year: 2024

# --- RAW LAYER ---
raw:
  output_policy: overwrite
  sources:
    - name: "fonte_principale_http"
      type: "http_file"
      args:
        url: "https://example.com/data/dataset_{year}.csv"
        filename: "dataset_{year}.csv"
      primary: true

# --- CLEAN LAYER ---
# Bootstrap: toolkit run raw -c candidates/<slug>/dataset.yml -y 2024
# Poi revisiona sql/clean.sql e clean.read prima del run completo.
clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest                  # latest | all (multi-file) | explicit | largest
    delim: ";"
    encoding: "utf-8"             # PA italiana: spesso cp1252
    header: true
    # altri campi SOLO se il parsing reale lo richiede (vedi config-schema.md)
  required_columns:               # obbligatorio — nomi colonne OUTPUT del clean.sql
    - anno
    - chiave_principale
  validate:
    min_rows: 100
    not_null:                     # obbligatorio
      - anno
      - chiave_principale
    primary_key:                  # obbligatorio se dichiarabile (deroga: nota in notes.md)
      - anno
      - chiave_principale

# --- MART LAYER ---
mart:
  tables:
    - name: "mart_template"
      sql: "sql/mart.sql"
  required_tables:                # tabelle essenziali (verifica presenza output)
    - "mart_template"
  validate:
    table_rules:
      mart_template:              # chiave = name in mart.tables
        required_columns:
          - anno
          - chiave_principale
        primary_key:              # deriva dal GROUP BY del mart.sql
          - anno
          - chiave_principale
        min_rows: 10

validation:
  fail_on_error: true
