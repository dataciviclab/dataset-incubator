# Join Map Registry — solo casi che lo scanner non scopre da solo
#
# Lo scanner (tools/join-scanner/scan_join_keys.py) trova automaticamente:
# - Tutti i join diretti: ISTAT, catastale, CF, denominazione
# - Normalizer: LPAD, RIGHT, UPPER TRIM, REPLACE brackets
# - Hub BDAP per chiavi ente (se BDAP disponibile localmente)
#
# Qui restano solo:
# - Bridge non rilevabili dallo scanner (es. Sogei, CIG multi-hop)
# - Cross-grano (NUTS, ecc.)
# - Casi particolari documentati
#
# Uso: prima chiedi allo scanner. Se non trova, guarda qui.

version: 2
hub:
  slug: comuni_master
  description: Golden record dei comuni italiani (ISTAT + IPA)
  keys:
    codice_istat: { format: istat_6, description: Codice ISTAT 6 cifre (es. 015002) }
    codice_catastale: { format: belfiore, description: Codice catastale Belfiore (es. A010) }
    denominazione: { format: title_case, description: Denominazione comune (title case) }
    codice_fiscale: { format: fiscal_code_11, description: Codice fiscale ente (es. 01310880156) }
    codice_ipa: { format: ipa_code, description: Codice IPA (es. c_a010) }
    nuts3_2021: { format: nuts3, description: Codice NUTS3 versione 2021 }
    nuts3_2024: { format: nuts3, description: Codice NUTS3 versione 2024 }

datasets:

  # ==========================================================================
  # BRIDGE BDAP (richiede bdap_anagrafe_enti, non rilevabile dallo scanner)
  # ==========================================================================

  - slug: dipendenti_pubblici
    name: Dipendenti Pubblici
    granularity: comune (via bridge BDAP)
    comuni_key:
      column: codice_ente_bdap
      format: bdap_id_18
    hub_key: codice_istat
    normalizer: via_bridge
    bridge_required: bdap_anagrafe_enti
    note: "codice_ente_bdap → bdap_anagrafe_enti.id_ente → codice_istat_comune. Match 100%."

  - slug: siope_bilancio_unificato
    name: SIOPE Bilancio Unificato
    granularity: comune (via bridge BDAP)
    comuni_key:
      column: codice_ente
      format: siope_9
    hub_key: codice_istat
    normalizer: via_bridge
    bridge_required: bdap_anagrafe_enti
    note: "codice_ente → bdap_anagrafe_enti.codice_ente_siope → codice_istat_comune. Match 99.2%."

  - slug: dait_amministratori_locali
    name: Amministratori Locali DAIT
    granularity: comune (via bridge BDAP)
    comuni_key:
      column: codice_dait_completo
      format: dait_9
    hub_key: codice_istat
    normalizer: via_bridge
    bridge_required: bdap_anagrafe_enti
    note: "codice_dait_completo → bdap_anagrafe_enti (mapping DAIT) → codice_istat_comune."

  # ==========================================================================
  # BRIDGE Sogei (FSC — richiede support dataset)
  # ==========================================================================

  - slug: opencivitas_fsc_2025_rso
    name: Fondo Solidarietà Comunale
    granularity: comune (via bridge Sogei + join testuale)
    comuni_key:
      column: username
      format: sogei_13
    hub_key: ~
    normalizer: via_bridge
    bridge_required: opencivitas_fsc_enti_rso
    note: >
      Due fasi: username → opencivitas_fsc_enti_rso (bridge) → denominazione+regione.
      Poi denominazione+regione → comuni_master via UPPER+TRIM.
      Il support dataset normalizza apostrofo→accento (76 comuni su 6573).
      Match rate dopo normalizzazione: ~99.9%.

  # ==========================================================================
  # BRIDGE CIG (ANAC multi-hop: aggiudicatari → bandi_gara → territorio)
  # ==========================================================================

  - slug: anac_aggiudicatari
    name: ANAC Aggiudicatari
    granularity: comune (via bridge CIG)
    hub_key: codice_istat
    normalizer: via_bridge
    bridge_required: anac_bandi_gara
    note: >
      Il CF è di imprese (non matcha). Join via CIG: cig → anac_bandi_gara.cig
      → codice_istat_luogo. 1.04M CIG su 4.8M matchano (21.6%).
      Di quelli, 99.1% ha territorio.

  - slug: anac_partecipanti
    name: ANAC Partecipanti
    granularity: comune (via bridge CIG)
    hub_key: codice_istat
    normalizer: via_bridge
    bridge_required: anac_bandi_gara
    note: "Stesso bridge CIG di anac_aggiudicatari."

  - slug: anac_subappalti
    name: ANAC Subappalti
    granularity: comune (via bridge CIG)
    hub_key: codice_istat
    normalizer: via_bridge
    bridge_required: anac_bandi_gara
    note: "Stesso bridge CIG. Attenzione: subappalto può avere luogo diverso dalla gara principale."

  # ==========================================================================
  # CROSS-GRANO NUTS (provincia → comune)
  # ==========================================================================

  - slug: eurostat_economy
    name: Indicatori economici regionali EU (PIL, GVA, occupazione)
    granularity: NUTS3 (provincia → comune via cross-grano)
    comuni_key:
      column: geo
      format: nuts3
    hub_key: nuts3_2021
    normalizer: direct
    note: "105/107 NUTS3 italiani matchano. 2 non matchano per cambio versione NUTS. 1 provincia → N comuni."

  - slug: eurostat_demography
    name: Indicatori demografici regionali EU
    granularity: NUTS3 (provincia → comune via cross-grano)
    comuni_key:
      column: geo
      format: nuts3
    hub_key: nuts3_2021
    normalizer: direct

  - slug: eurostat_territory
    name: Indicatori territoriali regionali EU
    granularity: NUTS3 (provincia → comune via cross-grano)
    comuni_key:
      column: geo
      format: nuts3
    hub_key: nuts3_2021
    normalizer: direct

  # ==========================================================================
  # COMPOSITE
  # ==========================================================================

  - slug: unified_comuni
    name: Unified Comuni — metriche multi-dominio
    granularity: comune
    comuni_key:
      column: codice_istat
      format: istat_6
    hub_key: codice_istat
    normalizer: direct
    is_composite: true
    note: "Compose multi-fonte. Include hub, popolazione, IRPEF, rifiuti, FSC, SIOPE, dipendenti, PNRR."

