[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-dataset-incubator"
version = "0.3.0"
description = "DataCivicLab Dataset Incubator: intake, validazione e promozione dataset"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "DataCivicLab" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # CLI + API del toolkit (engine raw→clean→mart).
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
    # Importato direttamente da due preprocess.py dei candidate
    # (`from lab_connectors.http import download`). Gli extra duckdb/mcp
    # arrivano gia' da toolkit: le transitive non si ripetono (ADR-001 §8).
    "lab-connectors @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0.0",
  "pytest-timeout>=2.3.0",
  "ruff>=0.3.0",
  "mypy>=1.20",
  "types-pyyaml>=6.0",
  "build>=1.4.3",
  "twine>=5.0.0",
]
pipeline = [
  # L'extra [pandas] del toolkit porta openpyxl/xlrd/odfpy: senza, ogni
  # candidate che legge Excel (clean.read su .xlsx/.xls o preprocess.py con
  # pd.read_excel) fallisce in CI con ImportError da pandas.compat._optional.
  # pandas arriva comunque per via transitiva, quindi l'errore e' silenzioso
  # fino al primo read_excel.
  "dataciviclab-toolkit[pandas] @ git+https://github.com/dataciviclab/toolkit.git",
]

[project.urls]
Repository = "https://github.com/dataciviclab/dataset-incubator"

[tool.setuptools]
# Il repo non espone un package Python: gli script in scripts/ sono importati
# dai test via sys.path (tests/conftest.py), non come package installabile.
packages = []

[tool.pytest.ini_options]
testpaths = "tests"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --tb=line --timeout=30"
markers = [
    "contract: interfaccia pubblica, artifact format, contratto API, path contract, output CI",
    "policy: regola Lab non ovvia o comportamento cross-component",
    "regression: bug fix documentato in issue/PR",
    "adapter: adapter a servizio esterno (GCS, BigQuery, HTTP)",
    "pure_unit: logica pura non banale, zero side effect",
    "smoke: test che fa chiamate reali (richiede connettivita')",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = false
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
