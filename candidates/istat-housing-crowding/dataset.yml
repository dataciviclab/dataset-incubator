root: "../../out"
schema_version: 1

dataset:
  name: "istat_housing_crowding"
  source_id: "istat_sdmx"
  tags: [welfare-lavoro, istat, housing, crowding]
  category: welfare-lavoro
  years: [2024]
  time_coverage:
    start_year: 2004
    end_year: 2025

# Crowding index Italia — 33_179 via type: sdmx (canale diretto esploradati)
# ABITAZ_AFFOLL_MED · componenti per 100 mq · titolo godimento 1=rent 2=property
# Le dimensioni breakdown non sono filtrate in raw (key vuota = all): richiede
# toolkit con fix #444 (key completa da datastructure, PR toolkit #501).

raw:
  output_policy: overwrite
  sources:
    - name: "istat_sdmx_housing_crowding"
      type: "sdmx"
      client:
        timeout: 120
        retries: 2
      args:
        agency: "IT1"
        flow: "33_179"
        version: "1.0"
        filters:
          FREQ: "A"
          REF_AREA: "IT"
          DATA_TYPE: "ABITAZ_AFFOLL_MED"
          MEASURE: "10"
        filename: "istat_housing_crowding_series.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - anno
    - ref_area_codice
    - titolo_godimento_codice
    - titolo_godimento
    - numero_componenti_nucleo
    - tipologia_nucleo_codice
    - numero_figli
    - quintile_reddito_codice
    - componenti_per_100mq
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  validate:
    not_null: [anno, titolo_godimento_codice]
    min_rows: 100

mart:
  tables:
    - name: "mart_crowding_tenure_italy"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_crowding_tenure_italy"
  validate:
    table_rules:
      mart_crowding_tenure_italy:
        not_null: [anno, titolo_godimento_codice]
        min_rows: 35

validation:
  fail_on_error: true
