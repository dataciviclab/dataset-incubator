root: "../../out"
schema_version: 1

dataset:
  name: "istat_housing_crowding"
  source_id: "istat_dbnomics"
  tags: [welfare-lavoro, istat, housing, crowding]
  category: welfare-lavoro
  years: [2024]
  time_coverage:
    start_year: 2004
    end_year: 2025

# Crowding index Italia — 33_179 via type: dbnomics
# ABITAZ_AFFOLL_MED · componenti per 100 mq · titolo godimento 1/2

raw:
  output_policy: overwrite
  sources:
    - name: "istat_dbnomics_housing"
      type: "dbnomics"
      client:
        timeout: 120
        retries: 2
      args:
        provider: ISTAT
        dataset: "33_179"
        dimensions:
          FREQ: [A]
          REF_AREA: [IT]
          DATA_TYPE: [ABITAZ_AFFOLL_MED]
          MEASURE: ["10"]
          TENURE_STATUS: ["1", "2"]
          NUMBER_HOUSEHOLD_COMP: ["99"]
          HOUSEHOLD_TYPOLOGY: ["99"]
          NUMB_OF_CHILDREN: ["9"]
          NUMB_OF_ELDERLY: ["9"]
          FIFTH_EQUIV_HOUSE_INC: ["9"]
          SEX_MAIN_PERCEPTOR: ["9"]
          AGE_MAIN_EARNIER: ["9"]
          EDU_LEV_MAIN_EARN: ["99"]
          LABPROF_STATUS_C_MAIN_EARNER: ["99"]
        page_size: 100
        max_pages: 10
        filename: "istat_housing_crowding_series.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - anno
    - ref_area_codice
    - ref_area
    - titolo_godimento_codice
    - titolo_godimento
    - componenti_per_100mq
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  validate:
    not_null: [anno, titolo_godimento_codice]
    min_rows: 20

mart:
  tables:
    - name: "mart_crowding_tenure_italy"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_crowding_tenure_italy"
  validate:
    table_rules:
      mart_crowding_tenure_italy:
        not_null: [anno, titolo_godimento_codice]
        min_rows: 35

validation:
  fail_on_error: true
