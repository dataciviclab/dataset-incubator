root: "../../out"
schema_version: 1

dataset:
  name: "camera_deputati_legislature"
  source_id: "dati_camera"
  tags: [politica, camera, deputati, legislature]
  category: politica
  years: [2026]
  time_coverage:
    start_year: 1861
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "camera_deputati_sparql"
      type: "sparql"
      primary: true
      args:
        endpoint: "https://dati.camera.it/sparql"
        query: |
          PREFIX foaf: <http://xmlns.com/foaf/0.1/>
          PREFIX ocd: <http://dati.camera.it/ocd/>
          PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
          PREFIX dc: <http://purl.org/dc/elements/1.1/>
          PREFIX dcterms: <http://purl.org/dc/terms/>
          SELECT ?deputato (MAX(?cogn) AS ?cogn) (MAX(?nome) AS ?nome)
                 (MAX(?label) AS ?label) (MAX(?gender) AS ?gender)
                 (MAX(?legislatura) AS ?legislatura)
                 (MAX(?biografia) AS ?biografia) (MAX(?foto) AS ?foto)
                 (MAX(?mandato) AS ?mandato) (MAX(?scheda) AS ?scheda)
          WHERE {
            ?deputato a ocd:deputato .
            OPTIONAL { ?deputato foaf:surname ?cogn . }
            OPTIONAL { ?deputato foaf:firstName ?nome . }
            OPTIONAL { ?deputato rdfs:label ?label . }
            OPTIONAL { ?deputato ocd:rif_leg ?leg .
                        BIND(
                          REPLACE(
                            STR(?leg), 'http://dati.camera.it/ocd/legislatura.rdf/', ''
                          ) AS ?legislatura
                        ) . }
            OPTIONAL { ?deputato foaf:gender ?gender . }
            OPTIONAL { ?deputato dc:description ?biografia . }
            OPTIONAL { ?deputato foaf:depiction ?foto . }
            OPTIONAL { ?deputato ocd:rif_mandatoCamera ?mandato . }
            OPTIONAL { ?deputato dcterms:isReferencedBy ?scheda . }
          }
          GROUP BY ?deputato
        # Paginazione OFFSET: niente ORDER BY (Virtuoso di dati.camera.it rifiuta
        # ORDER BY + OFFSET con SR353). La paginazione OFFSET senza ORDER BY è
        # non-deterministica ma è il comportamento che l'endpoint supporta; la
        # perdita di dati è protetta da min_rows + fail_on_error.
        pages: 3
        step: 10000
        accept_format: "sparql-results+json"

clean:
  sql: "sql/clean.sql"
  required_columns: [deputato, persona_id, cognome, nome, gender, legislatura, biografia, foto_url, mandato, scheda_url]
  read:
    source: auto
    mode: latest
    header: true
    encoding: "utf-8"
    strict_mode: false
    ignore_errors: true
    trim_whitespace: true
  validate:
    not_null: [deputato]
    # volume reale 27.764 deputati (2026) — margine ~45% di perdita tollerato
    min_rows: 15000

mart:
  tables:
    # Composizione per legislatura e genere
    - name: "mart_legislatura_genere"
      sql: "sql/mart_legislatura_genere.sql"
    # Top deputati per numero di legislature
    - name: "mart_top_mandati"
      sql: "sql/mart_top_mandati.sql"
  required_tables:
    - "mart_legislatura_genere"
    - "mart_top_mandati"
  validate:
    table_rules:
      mart_legislatura_genere:
        required_columns: [legislatura, n_deputati, n_donne, quota_donne_pct]
        primary_key: [legislatura]
        min_rows: 15
      mart_top_mandati:
        required_columns: [persona_id, n_legislature]
        primary_key: [persona_id]
        min_rows: 500

validation:
  fail_on_error: true
