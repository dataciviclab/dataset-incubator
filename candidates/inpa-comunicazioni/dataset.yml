# Comunicazioni di procedura dei concorsi inPA (ciclo di vita dei bandi)
# Fonte: API pubblica non documentata https://portale.inpa.gov.it/concorsi-smart/api/
# Harvest via scripts/harvest_comunicazioni.py

root: "../../out"
schema_version: 1

dataset:
  name: "inpa_comunicazioni"
  source_id: "inpa_reclutamento"
  tags: [pa, concorsi, reclutamento, esiti]
  category: pa
  # Snapshot dell'archivio vivo: anni = anno di snapshot
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "inpa_comunicazioni"
      # CSV prodotto da scripts/harvest_comunicazioni.py (harvest esplicito)
      type: "local_file"
      args:
        path: "../../out/data/raw/inpa_comunicazioni/2026/raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    header: true
    delim: ","
    encoding: "utf-8"
  required_columns: [id, concorso_id, concorso_title, subject, categoria, data_pubblicazione, ente]
  validate:
    not_null: [id, concorso_id, subject]
    primary_key: [id]
    min_rows: 1000

mart:
  tables:
    - name: "mart_esiti_per_categoria"
      sql: "sql/mart_esiti_per_categoria.sql"
    - name: "mart_esiti_per_ente"
      sql: "sql/mart_esiti_per_ente.sql"
  required_tables:
    - "mart_esiti_per_categoria"
    - "mart_esiti_per_ente"
  validate:
    table_rules:
      mart_esiti_per_categoria:
        required_columns: [categoria, num_comunicazioni]
        primary_key: [categoria]
        min_rows: 5
      mart_esiti_per_ente:
        required_columns: [ente, num_comunicazioni]
        primary_key: [ente]
        min_rows: 5

validation:
  fail_on_error: true
