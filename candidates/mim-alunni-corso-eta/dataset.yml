root: "../../out"
schema_version: 1

dataset:
  name: "mim_alunni_corso_eta"
  source_id: "mim_opendata"
  tags: [istruzione, mim, alunni, corso, eta]
  category: istruzione
  years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

support:
  - name: "scu_anagrafica_statali"
    config: "../../support_datasets/mim-anagrafica-scuole-statali/dataset.yml"
    years: [2024]

raw:
  sources:
    - name: "mim_alunni_corso_eta_csv"
      type: "http_file"
      args:
        url: "https://dati.istruzione.it/opendata/opendata/catalogo/elements1/ALUCORSOETASTA"
        filename: "ALUCORSOETASTA{year}.csv"
        url_suffix_by_year:
          2016: "20151620160831.csv"
          2017: "20161720170831.csv"
          2018: "20171820180831.csv"
          2019: "20181920190831.csv"
          2020: "20192020200831.csv"
          2021: "20202120210831.csv"
          2022: "20212220220831.csv"
          2023: "20222320230831.csv"
          2024: "20232420240831.csv"
          2025: "20242520250831.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno_scolastico, codice_scuola, denominazione_scuola, ordine_scuola, grado_istruzione_scuola, caratteristica_scuola, anno_corso, fascia_eta, alunni, area_geografica, regione, provincia, comune, codice_comune_scuola, cap_scuola, denominazione_istituto_riferimento]
  read:
    source: auto
    mode: latest
    header: true
    encoding: "utf-8"
    strict_mode: false
    ignore_errors: true
    trim_whitespace: true
  validate:
    not_null: [anno_scolastico, codice_scuola]
    min_rows: 50000
    primary_key: [anno_scolastico, codice_scuola, ordine_scuola, anno_corso, fascia_eta]

mart:
  tables:
    # Serie temporale alunni per ordine scolastico (multi-year: LAG su anni)
    - name: "mart_trend_ordine"
      sql: "sql/mart_trend_ordine.sql"
      years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    # Sintesi per regione × ordine (quota nazionale)
    - name: "mart_sintesi_regione"
      sql: "sql/mart_sintesi_regione.sql"
    # Alunni in età non allineata al corso per provincia (ripetenti/anticipatari)
    - name: "mart_ripetenti_provincia"
      sql: "sql/mart_ripetenti_provincia.sql"
    # Dettaglio comunale con benchmark provinciale
    - name: "mart_comune"
      sql: "sql/mart_comune.sql"
  required_tables:
    - "mart_trend_ordine"
    - "mart_ripetenti_provincia"
  validate:
    table_rules:
      mart_trend_ordine:
        required_columns: [anno_scolastico, ordine_scuola, alunni, delta_alunni, variazione_pct]
        primary_key: [anno_scolastico, ordine_scuola]
        min_rows: 3
      mart_sintesi_regione:
        required_columns: [regione, ordine_scuola, alunni, quota_nazionale_pct]
        primary_key: [regione, ordine_scuola]
        min_rows: 50
      mart_ripetenti_provincia:
        required_columns: [anno_scolastico, provincia, ordine_scuola, alunni_tot, alunni_non_allineati, quota_non_allineati_pct]
        primary_key: [anno_scolastico, provincia, ordine_scuola]
        min_rows: 50
      mart_comune:
        required_columns: [codice_comune_scuola, comune, ordine_scuola, alunni, quota_provinciale_pct]
        primary_key: [codice_comune_scuola, ordine_scuola]
        min_rows: 1000

validation:
  fail_on_error: true

