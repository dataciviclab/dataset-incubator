root: "../../out"
schema_version: 1

dataset:
  name: "minlavoro_flussi"
  source_id: "lavoro_opendata"
  tags: [welfare-lavoro, minlavoro, flussi, assunzioni, cessazioni, tirocini, somministrazione]
  category: welfare-lavoro
  description: "Comunicazioni obbligatorie MinLavoro: attivazioni, cessazioni, trasformazioni, tirocini e somministrazione. Fonde Nota trimestrale (2019-2023) e Rapporto Annuale (2021-2023) in schema long unico."
  years: [2023]
  time_coverage:
    start_year: 2019
    end_year: 2023

# Canale: type: script (extract.py) — 77 tabelle OData eterogenee fuse in un raw.csv long.
# Fonte primaria: CSV locali in data/ (gitignored, cache fetch_minlavoro).
# Fallback: OData API dati.lavoro.gov.it con retry (la fonte è instabile sotto richiamo ripetuto).
# CI: TOOLKIT_ALLOW_SCRIPT_SOURCE=1 già nel post-merge workflow.

raw:
  output_policy: overwrite
  sources:
    - name: "minlavoro_odata_flussi"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 600
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
  required_columns: [fonte, tabella_id, tipo_flusso, anno, indicatore, valore]
  validate:
    min_rows: 10000
    not_null: [anno, tipo_flusso, valore]
    # primary_key deroga: schema long fuso — la stessa combinazione di dimensioni
    # può comparire in più tabelle fonte (NOTA e RA) e con indicatori diversi.
    # L'unicità è garantita a livello di (tabella_id, indicatore, dimensioni).

mart:
  tables:
    - name: "mart_flussi_anno"
      sql: "sql/mart_flussi_anno.sql"
    - name: "mart_flussi_regione"
      sql: "sql/mart_flussi_regione.sql"
    - name: "mart_trasformazioni"
      sql: "sql/mart_trasformazioni.sql"
    - name: "mart_gap_genere"
      sql: "sql/mart_gap_genere.sql"
  required_tables: [mart_flussi_anno, mart_flussi_regione]
  validate:
    table_rules:
      mart_flussi_anno:
        required_columns: [anno, tipo_flusso, genere, tipologia_contratto, n_rapporti]
        primary_key: [anno, tipo_flusso, genere, tipologia_contratto]
        min_rows: 20
      mart_flussi_regione:
        required_columns: [anno, territorio, tipo_flusso, n_rapporti]
        primary_key: [anno, territorio, tipo_flusso]
        min_rows: 100

validation:
  fail_on_error: true

output:
  artifacts: "standard"
