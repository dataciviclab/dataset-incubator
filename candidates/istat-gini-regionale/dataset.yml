root: "../../out"
schema_version: 1

dataset:
  name: "istat_gini_regionale"
  source_id: "istat_dbnomics"
  tags: [finanza-pubblica, istat, gini]
  category: finanza-pubblica
  years: [2023]
  time_coverage:
    start_year: 2003
    end_year: 2024

# Gini reddito netto regionale — ISTAT 32_221 via type: dbnomics
# (no rate-limit SDMX; mirror allineato 2003-2024 su probe 2026-10)

raw:
  output_policy: overwrite
  sources:
    - name: "istat_dbnomics_gini"
      type: "dbnomics"
      client:
        timeout: 120
        retries: 2
      args:
        provider: ISTAT
        dataset: "32_221"
        dimensions:
          DATA_TYPE: [DISUG_REDDNET_GINI]
          IMPUTED_RENTS: ["1", "2"]
        page_size: 1000
        max_pages: 10
        filename: "istat_gini_regionale_series.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [regione_codice, regione, tipo_dato, pres_aff_imp, anno, gini]
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  validate:
    not_null: [anno, regione_codice, pres_aff_imp]
    min_rows: 50

mart:
  tables:
    - name: "mart_gini_regionale"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_gini_regionale"
  validate:
    table_rules:
      mart_gini_regionale:
        not_null: [anno, regione_codice, pres_aff_imp]
        min_rows: 400

validation:
  fail_on_error: true
