root: "../../out"
schema_version: 1

dataset:
  name: "elezioni_referendum"
  source_id: "eligendo"
  tags: [politica, elezioni, referendum]
  category: politica
  years: [1995, 1997, 1999, 2000, 2001, 2003, 2005, 2006, 2011, 2016, 2020, 2022]

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python preprocess.py {year} raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [data_elezione, regione, provincia, comune, num_quesito]
  read:
    mode: latest
    source: auto
    delim: ";"
    encoding: "utf-8"
    header: true
    strict_mode: false
    ignore_errors: true
  validate:
    not_null: [data_elezione]
    min_rows: 100

mart:
  tables:
    - name: "mart_voti_quesito_comune"
      sql: "sql/mart_voti_quesito_comune.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  validate:
    table_rules:
      mart_voti_quesito_comune:
        min_rows: 100
      mart_trend:
        min_rows: 10

validation:
  fail_on_error: true
