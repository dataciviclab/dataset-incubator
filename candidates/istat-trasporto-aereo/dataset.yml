root: "../../out"
schema_version: 1

dataset:
  name: "istat_trasporto_aereo"
  source_id: "istat_dbnomics"
  tags: [trasporti, aereo, aeroporti, passeggeri, merci, istat, dbnomics]
  category: trasporti
  years: [2026]
  time_coverage:
    start_year: 2003
    end_year: 2025

# Profilo, non produzione: max_pages=1 scarica 1.000 serie su 9.384.
# Serve a misurare copertura reale per aeroporto prima di impegnarsi.

raw:
  output_policy: overwrite
  sources:
    - name: "istat_dbnomics_aereo"
      type: "dbnomics"
      client:
        timeout: 240
        retries: 2
      args:
        provider: ISTAT
        dataset: "121_331"
        page_size: 1000
        max_pages: 1
        filename: "istat_aereo_series.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, aeroporto, tipo_servizio, arrivi_partenze, paese, valore]
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    not_null: [anno]
    min_rows: 100

mart:
  tables:
    - name: "mart_copertura_aeroporti"
      sql: "sql/mart_copertura_aeroporti.sql"
  required_tables:
    - "mart_copertura_aeroporti"
  validate:
    table_rules:
      mart_copertura_aeroporti:
        required_columns: [aeroporto, unita, osservazioni, primo, ultimo]
        min_rows: 5
        primary_key: [aeroporto, unita]

validation:
  fail_on_error: true

registry:
  theme: "Trasporto aereo per aeroporto e origine-destinazione"
  dimensions: ["AIRPORTS", "ARRIVING_DEPARTING", "COUNTRY_PREV_NEXT"]
  description: "ISTAT 121_331 via DBnomics — profilo"
