# Auto-generated by toolkit, manually adjusted for INPS CSV source
root: "../../out"
schema_version: 1

dataset:
  name: "inps_rdc_pdc"
  source_id: "inps_open_data"
  tags: [welfare-lavoro, inps, rdc, pdc]
  category: welfare-lavoro
  years: [2020]
  time_coverage: {start_year: 2020, end_year: 2020}

raw:
  output_policy: overwrite
  sources:
    - name: "inps_rdc_pdc_csv"
      type: "http_file"
      args:
        url: "https://servizi2.inps.it/docallegati/Mig/OpenData/CSV/ID-5773.csv"
        filename: "ID-5773.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: "utf-8"
    decimal: "."
    header: true
  required_columns: [anno, codice_istat, comune, codice_regione, codice_provincia, nuclei_rdc, nuclei_pdc, individui_coinvolti, componenti_per_famiglia, donne_per_famiglia, minori_18_per_famiglia, anziani_75_per_famiglia, importo_medio_mensile, dev_standard_importo, uomini_residenti, donne_residenti, popolazione_residente, takeup, takeup_donne]
  validate:
    not_null: [anno, codice_istat]
    min_rows: 7000
    primary_key: [codice_istat]

mart:
  tables:
    # Incidenza RdC/PdC per comune (takeup + tassi ricalcolati)
    - name: "mart_incidenza_comune"
      sql: "sql/mart_incidenza_comune.sql"
    # Sintesi per regione: nuclei, importo medio, incidenza
    - name: "mart_sintesi_regione"
      sql: "sql/mart_sintesi_regione.sql"
    # Top comuni per incidenza e per importo (benchmark)
    - name: "mart_top_comuni"
      sql: "sql/mart_top_comuni.sql"
  required_tables:
    - "mart_incidenza_comune"
    - "mart_sintesi_regione"
  validate:
    table_rules:
      mart_incidenza_comune:
        required_columns: [codice_istat, comune, codice_regione, nuclei_rdc, nuclei_pdc, popolazione_residente, incidenza_rdc_pct]
        primary_key: [codice_istat]
        min_rows: 7000
      mart_sintesi_regione:
        required_columns: [codice_regione, n_comuni, nuclei_rdc, nuclei_pdc, importo_medio_pesato, incidenza_media_pct]
        primary_key: [codice_regione]
        min_rows: 15
      mart_top_comuni:
        required_columns: [codice_istat, comune, incidenza_rdc_pct, nuclei_rdc]
        primary_key: [codice_istat]
        min_rows: 20

validation:
  fail_on_error: true
