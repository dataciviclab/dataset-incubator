root: "../../out"
schema_version: 1

dataset:
  name: "istat_cittadinanze"
  source_id: "istat_dbnomics"
  tags: [immigrazione, cittadinanza, istat, regioni]
  category: immigrazione
  years: [2026]
  time_coverage:
    start_year: 2012
    end_year: 2023

# Acquisizioni di cittadinanza italiana — ISTAT 29_849 via type: dbnomics
# (mirror DBnomics: nessun rate-limit SDMX). Serie per regione x ex-cittadinanza
# x processo di acquisizione (matrimonio / residenza / altro).

raw:
  output_policy: overwrite
  sources:
    - name: "istat_dbnomics_cittadinanze"
      type: "dbnomics"
      client:
        timeout: 180
        retries: 2
      args:
        provider: ISTAT
        dataset: "29_849"
        dimensions:
          DATA_TYPE: [ACQCITIZ]
          SEX: ["9"]
          AGE: [TOTAL]
        page_size: 1000
        max_pages: 10
        filename: "istat_cittadinanze_series.csv"
      primary: true

support:
  - name: territori
    type: dataset
    config: "../../support_datasets/istat-territori/dataset.yml"
    years: [2026]
  - name: cittadinanze
    type: dataset
    config: "../../support_datasets/istat-cittadinanze-codelist/dataset.yml"
    years: [2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  required_columns: [anno, territorio_codice, territorio, livello, cittadinanza_codice, cittadinanza, processo_codice, processo, acquisizioni]
  validate:
    not_null: [anno, territorio_codice, livello, acquisizioni]
    min_rows: 100

mart:
  tables:
    - name: "mart_cittadinanze"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_cittadinanze"
  validate:
    table_rules:
      mart_cittadinanze:
        not_null: [anno, territorio_codice, livello, acquisizioni]
        min_rows: 100

validation:
  fail_on_error: true
