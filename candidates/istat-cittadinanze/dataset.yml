root: "../../out"
schema_version: 1

dataset:
  name: "istat_cittadinanze"
  source_id: "istat_dbnomics"
  tags: [immigrazione, cittadinanza, istat, regioni]
  category: immigrazione
  years: [2026]
  time_coverage:
    start_year: 2012
    end_year: 2023

# Acquisizioni di cittadinanza italiana — ISTAT 29_849 via type: dbnomics
# (mirror DBnomics: nessun rate-limit SDMX). Serie per regione x ex-cittadinanza
# x processo di acquisizione (matrimonio / residenza / altro).

raw:
  output_policy: overwrite
  sources:
    - name: "istat_dbnomics_cittadinanze"
      type: "dbnomics"
      client:
        timeout: 180
        retries: 2
      args:
        provider: ISTAT
        dataset: "29_849"
        dimensions:
          DATA_TYPE: [ACQCITIZ]
          SEX: ["9"]
          AGE: [TOTAL]
        page_size: 1000
        max_pages: 10
        filename: "istat_cittadinanze_series.csv"
      primary: true

support:
  - name: territori
    type: file
    path: "../../codelists/istat_territori.csv"
  - name: cittadinanze
    type: file
    path: "../../codelists/istat_cittadinanze.csv"

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  required_columns: [anno, territorio_codice, territorio, livello, cittadinanza_codice, cittadinanza, processo_codice, processo, acquisizioni]
  validate:
    not_null: [anno, territorio_codice, livello, acquisizioni]
    min_rows: 100

mart:
  tables:
    - name: "mart_cittadinanze"
      sql: "sql/mart_cittadinanze.sql"
    - name: "mart_cittadinanze_processo"
      sql: "sql/mart_cittadinanze_processo.sql"
    - name: "mart_cittadinanze_serie"
      sql: "sql/mart_cittadinanze_serie.sql"
  required_tables:
    - "mart_cittadinanze"
    - "mart_cittadinanze_processo"
    - "mart_cittadinanze_serie"
  validate:
    table_rules:
      mart_cittadinanze:
        required_columns: [anno, territorio_codice, cittadinanza_codice, acquisizioni, quota_pct]
        primary_key: [anno, territorio_codice, cittadinanza_codice]
        min_rows: 100
      mart_cittadinanze_processo:
        required_columns: [anno, territorio_codice, processo_codice, acquisizioni, quota_pct]
        primary_key: [anno, territorio_codice, processo_codice]
        min_rows: 100
      mart_cittadinanze_serie:
        required_columns: [anno, processo_codice, acquisizioni_italia]
        primary_key: [anno, processo_codice]
        min_rows: 5

validation:
  fail_on_error: true
