root: "../../out"
schema_version: 1

dataset:
  name: "istat_cittadinanze"
  source_id: "istat_sdmx"
  tags: [immigrazione, cittadinanza, istat, regioni]
  category: immigrazione
  description: "Acquisizioni di cittadinanza italiana per territorio, ex-cittadinanza e processo (2012-2025). ISTAT 29_849 via SDMX."
  years: [2026]
  time_coverage:
    start_year: 2012
    end_year: 2025

# Acquisizioni di cittadinanza italiana — ISTAT 29_849 via type: sdmx.
# Serie per regione x ex-cittadinanza x processo di acquisizione
# (matrimonio / residenza / altro).
#
# Canale: SDMX live (esploradati) — il mirror DBnomics è fermo al 2023
# (ultimo indice 2024-10), mentre la fonte ISTAT espone 2024 e 2025.
# La dimensione temporale non è nella key: si fetcha l'intera serie.

raw:
  output_policy: overwrite
  sources:
    - name: "istat_sdmx_cittadinanze"
      type: "sdmx"
      client:
        timeout: 300
        retries: 2
      args:
        agency: "IT1"
        flow: "29_849"
        version: "1.0"
        filters:
          FREQ: "A"
          DATA_TYPE: "ACQCITIZ"
          SEX: "9"
          AGE: "TOTAL"
        filename: "istat_cittadinanze_series.csv"
      primary: true

support:
  - name: territori
    type: file
    path: "../../codelists/istat_territori.csv"
  - name: cittadinanze
    type: file
    path: "../../codelists/istat_cittadinanze.csv"

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  required_columns: [anno, territorio_codice, territorio, livello, cittadinanza_codice, cittadinanza, processo_codice, processo, acquisizioni]
  validate:
    not_null: [anno, territorio_codice, livello, acquisizioni]
    primary_key: [anno, territorio_codice, cittadinanza_codice, processo_codice]
    min_rows: 100

mart:
  tables:
    - name: "mart_cittadinanze"
      sql: "sql/mart_cittadinanze.sql"
    - name: "mart_cittadinanze_processo"
      sql: "sql/mart_cittadinanze_processo.sql"
    - name: "mart_cittadinanze_serie"
      sql: "sql/mart_cittadinanze_serie.sql"
  required_tables:
    - "mart_cittadinanze"
    - "mart_cittadinanze_processo"
    - "mart_cittadinanze_serie"
  validate:
    table_rules:
      mart_cittadinanze:
        required_columns: [anno, territorio_codice, cittadinanza_codice, acquisizioni, quota_pct]
        primary_key: [anno, territorio_codice, cittadinanza_codice]
        min_rows: 100
      mart_cittadinanze_processo:
        required_columns: [anno, territorio_codice, processo_codice, acquisizioni, quota_pct]
        primary_key: [anno, territorio_codice, processo_codice]
        min_rows: 100
      mart_cittadinanze_serie:
        required_columns: [anno, processo_codice, acquisizioni_italia]
        primary_key: [anno, processo_codice]
        min_rows: 5

validation:
  fail_on_error: true

output:
  artifacts: "standard"
