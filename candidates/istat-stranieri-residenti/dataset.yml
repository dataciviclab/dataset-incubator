root: "../../out"
schema_version: 1

dataset:
  name: "istat_stranieri_residenti"
  source_id: "istat_dbnomics"
  tags: [immigrazione, popolazione-straniera, istat, province]
  category: immigrazione
  years: [2026]
  time_coverage:
    start_year: 2019
    end_year: 2023

# Stranieri residenti al 1 gennaio per provincia x cittadinanza —
# ISTAT 29_317_DF_DCIS_POPSTRCIT1_1 via type: dbnomics (mirror, no rate-limit SDMX).
# Slice: DATA_TYPE=FJAN, sesso = totale.

raw:
  output_policy: overwrite
  sources:
    - name: "istat_dbnomics_stranieri"
      type: "dbnomics"
      client:
        timeout: 240
        retries: 2
      args:
        provider: ISTAT
        dataset: "29_317_DF_DCIS_POPSTRCIT1_1"
        dimensions:
          DATA_TYPE: [FJAN]
          SEX: ["9"]
        page_size: 1000
        max_pages: 60
        filename: "istat_stranieri_residenti_series.csv"
      primary: true

support:
  - name: territori
    type: file
    path: "../../codelists/istat_territori.csv"
  - name: cittadinanze
    type: file
    path: "../../codelists/istat_cittadinanze.csv"

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  required_columns: [anno, territorio_codice, territorio, livello, cittadinanza_codice, cittadinanza, residenti]
  validate:
    not_null: [anno, territorio_codice, livello, residenti]
    min_rows: 100

mart:
  tables:
    - name: "mart_stranieri_residenti"
      sql: "sql/mart_stranieri_residenti.sql"
    - name: "mart_stranieri_residenti_serie"
      sql: "sql/mart_stranieri_residenti_serie.sql"
  required_tables:
    - "mart_stranieri_residenti"
    - "mart_stranieri_residenti_serie"
  validate:
    table_rules:
      mart_stranieri_residenti:
        required_columns: [anno, territorio_codice, cittadinanza_codice, residenti, quota_pct]
        primary_key: [anno, territorio_codice, cittadinanza_codice]
        min_rows: 100
      mart_stranieri_residenti_serie:
        required_columns: [anno, residenti_italia]
        primary_key: [anno]
        min_rows: 5

validation:
  fail_on_error: true
