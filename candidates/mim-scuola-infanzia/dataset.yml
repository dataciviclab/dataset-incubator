root: "../../out"
schema_version: 1

dataset:
  name: "mim_scuola_infanzia"
  source_id: "mim_opendata"
  tags: [istruzione, mim, scuola, infanzia]
  category: istruzione
  years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  # NOTA: 2017 non disponibile — il server restituisce HTML invece del CSV

support:
  - name: "scu_anagrafica_statali"
    config: "../../support_datasets/mim-anagrafica-scuole-statali/dataset.yml"
    years: [2024]

raw:
  sources:
    - name: "mim_scuola_infanzia_csv"
      type: "http_file"
      args:
        url: "https://dati.istruzione.it/opendata/opendata/catalogo/elements1/INFANZIASTRACITSTA"
        filename: "INFANZIASTRACITSTA{year}.csv"
        url_suffix_by_year:
          2018: "20171820180831.csv"
          2019: "20181920190831.csv"
          2020: "20192020200831.csv"
          2021: "20202120210831.csv"
          2022: "20212220220831.csv"
          2023: "20222320230831.csv"
          2024: "20232420240831.csv"
          2025: "20242520250831.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno_scolastico, codice_scuola, denominazione_scuola, grado_istruzione_scuola, caratteristica_scuola, bambini_italiani, bambini_non_italiani, bambini_totale, area_geografica, regione, provincia, comune, codice_comune_scuola, denominazione_istituto_riferimento]
  read:
    source: auto
    mode: latest
    header: true
    encoding: "utf-8"
    strict_mode: false
    ignore_errors: true
    trim_whitespace: true
  validate:
    not_null: [anno_scolastico, codice_scuola]
    min_rows: 5000
    primary_key: [anno_scolastico, codice_scuola]

mart:
  tables:
    # Serie temporale bambini per cittadinanza (multi-year: LAG su anni)
    - name: "mart_trend_cittadinanza"
      sql: "sql/mart_trend_cittadinanza.sql"
      years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    # Sintesi per regione con quota stranieri
    - name: "mart_sintesi_regione"
      sql: "sql/mart_sintesi_regione.sql"
    # Dettaglio comunale con benchmark provinciale
    - name: "mart_comune"
      sql: "sql/mart_comune.sql"
  required_tables:
    - "mart_trend_cittadinanza"
    - "mart_sintesi_regione"
  validate:
    table_rules:
      mart_trend_cittadinanza:
        required_columns: [anno_scolastico, italiani, non_italiani, totale, quota_non_italiani_pct]
        primary_key: [anno_scolastico]
        min_rows: 8
      mart_sintesi_regione:
        required_columns: [regione, bambini_italiani, bambini_non_italiani, bambini_totale, quota_non_italiani_pct]
        primary_key: [regione]
        min_rows: 15
      mart_comune:
        required_columns: [codice_comune_scuola, comune, bambini_totale, quota_non_italiani_pct]
        primary_key: [codice_comune_scuola]
        min_rows: 500

validation:
  fail_on_error: true
