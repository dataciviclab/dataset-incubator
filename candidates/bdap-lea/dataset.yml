root: "../../out"
schema_version: 1

dataset:
  name: "bdap_lea"
  source_id: "openbdap"
  tags: [sanita, bdap, lea]
  category: sanita
  description: "Modello LEA degli enti del SSN: costo per voce contabile (prevenzione, distrettuale, ospedaliera, ricerca) per ente e regione."
  years: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  time_coverage: {start_year: 2012, end_year: 2024}

raw:
  output_policy: overwrite
  sources:
    - name: "bdap_lea_csv"
      type: "http_file"
      args:
        url: "https://bdap-opendata.rgs.mef.gov.it/SpodCkanApi/api/3/datastore/dump/"
        filename: "bdap_lea_{year}.csv"
        url_suffix_by_year:
          2012: "8f5ddfee-ddc6-4501-9976-0349c1144b4f.csv"
          2013: "4d698f29-c0ad-49f7-96d5-ae32ece1240f.csv"
          2014: "d5f56bc3-d865-45ce-b628-8b189f73c243.csv"
          2015: "51b46f0f-a6a7-4d50-9516-bd4ad116cee5.csv"
          2016: "d4a11625-dd0e-474b-af39-7604f36be6ca.csv"
          2017: "a1e612a6-5358-4173-bb80-9aa553125989.csv"
          2018: "493005a0-ae88-47a9-97cd-66548ebe190d.csv"
          2019: "a0904cd1-4cd5-40cd-9cdb-9fc404bde499.csv"
          2020: "d4816c3b-3c63-412e-aa82-ec65acaf64e7.csv"
          2021: "f1cb1b41-d0bb-4d37-b2cb-b077a5720454.csv"
          2022: "7572d620-36fd-4614-90d1-8412d48f5feb.csv"
          2023: "ac535673-49fb-4449-960e-fac8e3d14fa7.csv"
          2024: "d598ebd9-949d-4214-bb33-cd9c1be08f15.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno_riferimento, codice_regione, descrizione_regione, codice_ente_ssn, codice_ente_bdap, descrizione_ente, codice_voce_contabile, descrizione_voce_contabile, data_aggiornamento]
  read:
    source: "config_only"
    mode: "latest"
    header: true
    delim: ";"
    encoding: "cp1252"
    # "Oneri Finanziari" esiste solo dal 2019 e non in tutti gli anni (manca nel
    # 2020 e nel 2023): lo schema dichiarato + align_by_header riempie le
    # colonne assenti con NULL invece di slittare le posizioni.
    normalize_rows_to_columns: true
    align_by_header: true
    strict_mode: false
    sample_size: -1
    trim_whitespace: true
    columns:
      "Anno di Riferimento": "VARCHAR"
      "Codice Regione": "VARCHAR"
      "Descrizione Regione": "VARCHAR"
      "Codice Ente SSN": "VARCHAR"
      "Codice Ente BDAP": "VARCHAR"
      "Descrizione Ente": "VARCHAR"
      "Codice Voce Contabile": "VARCHAR"
      "Descrizione Voce Contabile": "VARCHAR"
      "Oneri Finanziari": "VARCHAR"
      "Data Aggiornamento": "VARCHAR"
      "Consumi sanitari": "VARCHAR"
      "Consumi non sanitari": "VARCHAR"
      "Prestazioni sanitarie": "VARCHAR"
      "Servizi sanitari": "VARCHAR"
      "Servizi non sanitari": "VARCHAR"
      "Personale Sanitario": "VARCHAR"
      "Personale Professionale": "VARCHAR"
      "Personale Tecnico": "VARCHAR"
      "Personale Amministrativo": "VARCHAR"
      "Ammortamenti": "VARCHAR"
      "Sopravvenienze e Insussistenze": "VARCHAR"
      "Altri costi": "VARCHAR"
      "Importo Totale": "VARCHAR"
  validate:
    min_rows: 1000
    not_null: [anno_riferimento, codice_ente_bdap, codice_ente_ssn, codice_voce_contabile]
    primary_key: [anno_riferimento, codice_ente_bdap, codice_ente_ssn, codice_voce_contabile]

mart:
  tables:
    - name: "mart_spesa_enti"
      sql: "sql/mart.sql"
    - name: "mart_totale_ente"
      sql: "sql/mart_totale_ente.sql"
  required_tables:
    - "mart_spesa_enti"
    - "mart_totale_ente"
  validate:
    table_rules:
      mart_spesa_enti:
        required_columns: [anno_riferimento, codice_ente_bdap, codice_voce_contabile, importo_totale]
        primary_key: [anno_riferimento, codice_ente_bdap, codice_ente_ssn, codice_voce_contabile]
        min_rows: 1000
      mart_totale_ente:
        required_columns: [anno_riferimento, codice_ente_bdap, totale, quadratura]
        primary_key: [anno_riferimento, codice_ente_bdap, codice_ente_ssn]
        min_rows: 100

validation:
  fail_on_error: true
