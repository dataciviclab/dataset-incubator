root: "../../out"
schema_version: 1

dataset:
  name: "istat_proiezioni_demografiche"
  source_id: "istat_demo"
  tags: [demografia, welfare-lavoro, istat, proiezioni, popolazione, forecast]
  category: welfare-lavoro
  years: [2025]
  time_coverage:
    start_year: 2025
    end_year: 2080

# Proiezioni demografiche ISTAT — base 1/1/2025, orizzonte 2080
# Fonte: demo.istat.it ZIP ufficiale (età × sesso × regione)
# Scenario mediano. Italia calcolata sommando le regioni nel mart.

raw:
  output_policy: overwrite
  sources:
    - name: "istat_demo_proiezioni"
      type: "script"
      args:
        command: "python preprocess.py raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - territorio_codice
    - anno
    - sesso
    - eta
    - popolazione
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  validate:
    not_null: [territorio_codice, anno, sesso, eta, popolazione]
    primary_key: [territorio_codice, anno, sesso, eta]
    min_rows: 1000

mart:
  tables:
    - name: "mart_regioni"
      sql: "sql/mart_regioni.sql"
    - name: "mart_italia"
      sql: "sql/mart_italia.sql"
  required_tables:
    - "mart_regioni"
    - "mart_italia"
  validate:
    table_rules:
      mart_regioni:
        required_columns: [territorio_codice, anno, sesso, eta, popolazione]
        not_null: [territorio_codice, anno, sesso, eta, popolazione]
        primary_key: [territorio_codice, anno, sesso, eta]
        min_rows: 1000
      mart_italia:
        required_columns: [anno, sesso, eta, popolazione]
        not_null: [anno, sesso, eta, popolazione]
        primary_key: [anno, sesso, eta]
        min_rows: 100

validation:
  fail_on_error: true
