root: "../../out"
schema_version: 1

dataset:
  name: "istat_proiezioni_demografiche"
  source_id: "istat_demo"
  tags: [demografia, welfare-lavoro, istat, proiezioni, popolazione, forecast]
  category: welfare-lavoro
  years: [2025]
  time_coverage:
    start_year: 2025
    end_year: 2080

# Proiezioni demografiche ISTAT — base 1/1/2025, orizzonte 2080
# Canale: demo.istat.it (RPCCerca.php) — SPA API JSON, niente SDMX
# Fonte alternativa: IstatData dataflow 165_889 (DCIS_PREVDEM1) — flaky
# Comunicato: https://www.istat.it/comunicato-stampa/previsioni-della-popolazione-residente-delle-famiglie-e-delle-forze-di-lavoro-base-1-1-2025/
#
# preprocess.py: fetch bilancio demografico (popolazione, nati, morti, saldi)
# per Italia + ripartizioni + 21 regioni, anni 2025-2080, scenario mediano.

raw:
  output_policy: overwrite
  sources:
    - name: "istat_demo_proiezioni"
      type: "script"
      args:
        command: "python preprocess.py raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - grano
    - territorio_codice
    - componente_codice
    - anno
    - valore
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  validate:
    not_null: [anno, territorio_codice, grano, valore]
    primary_key: [grano, territorio_codice, componente_codice, anno, sesso, eta]
    min_rows: 100

mart:
  tables:
    - name: "mart_popolazione_anno"
      sql: "sql/mart_popolazione_anno.sql"
    - name: "mart_componenti_anno"
      sql: "sql/mart_componenti_anno.sql"
  required_tables:
    - "mart_popolazione_anno"
    - "mart_componenti_anno"
  validate:
    table_rules:
      mart_popolazione_anno:
        required_columns: [anno, territorio_codice, sesso, eta, popolazione]
        not_null: [anno, territorio_codice, sesso, eta, popolazione]
        primary_key: [anno, territorio_codice, sesso, eta]
        min_rows: 100
      mart_componenti_anno:
        required_columns: [anno, territorio_codice, componente_codice, valore]
        not_null: [anno, territorio_codice, componente_codice]
        primary_key: [anno, territorio_codice, componente_codice]
        min_rows: 100

validation:
  fail_on_error: true
