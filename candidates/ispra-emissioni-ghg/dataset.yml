# Auto-generated by toolkit, manually adjusted for XLSX source
root: "../../out"
schema_version: 1

dataset:
  name: "ispra_emissioni_ghg"
  source_id: "ispra"
  tags: [ambiente, ispra, emissioni, ghg]
  category: ambiente
  description: "Emissioni di gas serra da processi energetici per settore economico (1990-2024). ISPRA, Indicatori ambientali."
  years: [2024]
  # Anno nominale: il file XLSX copre l'intera serie 1990-2024 (35 anni).
  # Non esistono file separati per anno: years=2024 e` l'ultimo anno del rilascio.
  # Output in formato wide: una riga per anno, colonne per settore e totale.
  time_coverage: {start_year: 1990, end_year: 2024}

raw:
  output_policy: overwrite
  sources:
    - name: "ispra_emissioni_ghg_xls"
      type: script
      args:
        command: "python preprocess.py raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ";"
    encoding: "utf-8"
    header: true
    decimal: "."
  required_columns: ["anno", "industrie_energetiche", "industrie_manifatturiere", "residenziale_e_servizi", "trasporti", "totale"]
  validate:
    min_rows: 30
    not_null: [anno]
    primary_key: [anno]

mart:
  tables:
    # Serie storica long: anno x settore con quota % sul totale nazionale
    - name: "mart_settori_anno"
      sql: "sql/mart_settori_anno.sql"
    # Trend per settore: delta 1990->ultimo anno, CAGR, picco, benchmark
    - name: "mart_trend_settori"
      sql: "sql/mart_trend_settori.sql"
  required_tables:
    - "mart_settori_anno"
    - "mart_trend_settori"
  validate:
    table_rules:
      mart_settori_anno:
        required_columns: [anno, settore, emissioni_mt, quota_pct]
        primary_key: [anno, settore]
        min_rows: 100
      mart_trend_settori:
        required_columns: [settore, emissioni_1990, emissioni_ultimo, delta_pct, cagr_annuale]
        primary_key: [settore]
        min_rows: 5

validation:
  fail_on_error: true

output:
  artifacts: "standard"
