root: "../../out"
schema_version: 1

dataset:
  name: "ted_contract_notices"
  source_id: "ted"
  tags: [appalti, ted, contract, notices]
  category: appalti
  years: [2023, 2022, 2021, 2020]

raw:
  extractor:
    type: "unzip_first_csv"
  sources:
    - name: "ted_cn_{year}"
      type: "http_file"
      args:
        url: "https://data.europa.eu/api/hub/store/data/ted-contract-notices-{year}.zip"
        filename: "ted-contract-notices-{year}.zip"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [ted_notice_url, anno_pubblicazione, id_tipo_notice, data_invio, xsd_version, future_can_id, flag_multipla_stazione, stazione_appaltante_nome, stazione_appaltante_codice_nazionale, stazione_appaltante_indirizzo, stazione_appaltante_citta, stazione_appaltante_cap, paese, flag_multi_paese, paesi_coinvolti, tipo_stazione_appaltante, codice_istituzione_ue, attivita_principale, flag_per_conto_terzi, flag_appalto_congiunto, flag_aggiudicato_centrale, tipo_contratto, nuts_luogo_esecuzione, flag_accordo_quadro, flag_operatore_unico, flag_sistema_dinamico, cpv_codice, id_lotto, cpv_codici_aggiuntivi, flag_gpa, flag_varianti, flag_opzioni, flag_fondi_ue, flag_rinnovo, data_inizio_contratto, data_fine_contratto, tipo_procedura, flag_accelerata, codice_criterio_aggiudicazione, criteri_qualitativi, pesi_criteri, flag_asta_elettronica, data_scadenza_offerte, flag_lingua_qualsiasi_ce, lingue_ammesse, altre_lingue_ammesse, flag_appalto_ricorrente]
  read:
    header: true
    delim: ","
    encoding: "utf-8"
    quote: '"'
    escape: '"'
    dateformat: "%d/%m/%y"
    trim_whitespace: true
    sample_size: -1
  validate:
    not_null: [anno_pubblicazione]
    promotion:
      max_row_drop_pct: 100.0
      fail_on_row_drop_exceeded: false

mart:
  tables:
    - name: "mart_bandi_ue_italia"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_bandi_ue_italia"

validation:
  fail_on_error: true
