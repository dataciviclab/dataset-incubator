root: "../../out"
schema_version: 1

dataset:
  name: "siope_bilancio_unificato"
  source_id: "siope"
  tags: [finanza-pubblica, siope, bilancio, unificato]
  category: finanza-pubblica
  years: [2021, 2022, 2023, 2024, 2025, 2026]

raw:
  sources:
    - name: "siope_entrate"
      type: "http_file"
      args:
        url: "https://storage.googleapis.com/dataciviclab-clean/siope/siope_entrate/{year}/siope_entrate_{year}_clean.parquet"
        filename: "siope_entrate_{year}.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    mode: "latest"
    header: true
  required_columns:
    - lato
    - codice_comparto
    - anno
    - periodo
    - codice_ente
    - codice_voce
    - denominazione_ente
    - tipo_ente
    - codice_istat_comune
    - codice_provincia
    - provincia
    - regione
    - codice_sottocomparto
    - descrizione_sottocomparto
    - descrizione_comparto
    - is_titolo_9
    - descrizione_codice
    - has_codgest_match
    - importo
    - importo_eur
  validate:
    min_rows: 500000
    primary_key:
      [
        "lato",
        "codice_comparto",
        "anno",
        "periodo",
        "codice_ente",
        "codice_voce",
      ]
    not_null:
      - lato
      - anno
      - periodo
      - codice_ente
      - importo

mart:
  tables:
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
    - name: "mart_enti"
      sql: "sql/mart_enti.sql"
  required_tables:
    - "mart_sintesi"
    - "mart_trend"
    - "mart_enti"
  validate:
    table_rules:
      mart_sintesi:
        min_rows: 10
      mart_trend:
        min_rows: 5
      mart_enti:
        min_rows: 100

validation:
  fail_on_error: true
