root: "../../out"
schema_version: 1

dataset:
  name: "elezioni_politiche"
  source_id: "ministero_interno_dait"
  tags: [politica, elezioni, politiche]
  category: politica
  years: [2022]
  time_coverage:
    mode: full_series
    start_year: 1948
    end_year: 2022

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python preprocess.py {year} raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [data_elezione, camera_senato, circoscrizione, provincia, comune, collegio_plurinominale, collegio_uninominale, lista, descr_lista, cognome, nome, luogo_nascita, data_nascita, sesso]
  read:
    mode: latest
    source: auto
    delim: ","
    encoding: "utf-8"
    header: true
    quote: '"'
  validate:
    not_null: [data_elezione]
    min_rows: 50000

mart:
  tables:
    - name: "mart_voti_elezioni_politiche"
      sql: "sql/mart_voti_elezioni_politiche.sql"
    - name: "mart_candidati"
      sql: "sql/mart_candidati.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
  required_tables:
    - "mart_voti_elezioni_politiche"
  validate:
    table_rules:
      mart_voti_elezioni_politiche:
        min_rows: 10000
      mart_candidati:
        min_rows: 50
        # Nota: candidati uninominali disponibili solo per 2018 e 2022
        # (sistema Rosatellum). Tornate precedenti non hanno cognome/nome
        # nei dati Eligendo processati dal preprocess.py.
      mart_trend:
        min_rows: 100

validation:
  fail_on_error: true
