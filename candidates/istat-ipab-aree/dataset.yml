root: "../../out"
schema_version: 1

dataset:
  name: "istat_ipab_aree"
  source_id: "istat_dbnomics"
  tags: [welfare-lavoro, istat, ipab, aree]
  category: welfare-lavoro
  years: [2024]
  time_coverage:
    start_year: 2010
    end_year: 2025

# IPAB aree aggregate — 143_497 via type: dbnomics
# DATA_TYPE=59 · MEASURE=4 · NEW_DW/EXST_DW · FREQ=Q

raw:
  output_policy: overwrite
  sources:
    - name: "istat_dbnomics_ipab"
      type: "dbnomics"
      client:
        timeout: 120
        retries: 2
      args:
        provider: ISTAT
        dataset: "143_497"
        dimensions:
          FREQ: [Q]
          DATA_TYPE: ["59"]
          MEASURE: ["4"]
          PURCHASES_DWELLINGS: [NEW_DW, EXST_DW]
        page_size: 500
        max_pages: 20
        filename: "istat_ipab_aree_series.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - area_codice
    - area
    - livello_geografico
    - tipo_abitazione
    - trimestre
    - indice_prezzi
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  validate:
    not_null: [area_codice, trimestre]
    min_rows: 900

mart:
  tables:
    - name: "ipab_aree"
      sql: "sql/mart.sql"
  required_tables: ["ipab_aree"]
  validate: {}

validation:
  fail_on_error: true
