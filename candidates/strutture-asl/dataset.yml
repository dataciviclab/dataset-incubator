root: "../../out"
schema_version: 1

dataset:
  name: "strutture_asl"
  source_id: "ministero_salute"
  tags: [sanita, strutture, asl]
  category: sanita
  years: [2022]

raw:
  sources:
    - name: "strutture_asl"
      type: "http_file"
      args:
        url: "https://www.dati.salute.gov.it/sites/default/files/2024-05/Strutture_e_attivit%C3%A0_ASL.csv"
        filename: "strutture_asl_2022.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, codice_regione, codice_asl, regione, denominazione_asl, indirizzo_asl, cap_asl, comune_asl, sigla_provincia_asl, adi_casi_trattati, adi_casi_trattati_anziani]
  read:
    source: auto
    mode: latest
    delim: ";"
    encoding: "latin-1"
    header: true
  validate:
    not_null: [anno]
    min_rows: 20

mart:
  tables:
    - name: "mart_regioni"
      sql: "sql/mart.sql"
  validate:
    table_rules:
      mart_regioni: { min_rows: 21 }

validation:
  fail_on_error: true
