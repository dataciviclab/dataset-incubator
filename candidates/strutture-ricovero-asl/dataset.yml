root: "../../out"
schema_version: 1

dataset:
  name: "strutture_ricovero_asl"
  source_id: "ministero_salute"
  tags: [sanita, strutture, ricovero, asl]
  category: sanita
  years: [2022]

raw:
  sources:
    - name: "strutture_ricovero_asl"
      type: "http_file"
      args:
        url: "https://www.dati.salute.gov.it/sites/default/files/2025-01/Strutture_di_ricovero_pubbliche_presenti_nel_territorio_della_ASL.csv"
        filename: "strutture_ricovero_asl_2022.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, codice_struttura, denominazione_struttura, comune, sigla_provincia_struttura, tipo_struttura, codice_regione, regione, codice_asl, asl]
  read:
    source: auto
    mode: latest
    delim: ";"
    encoding: "latin-1"
    header: true
    decimal: ","
    thousands: "."
  validate:
    not_null: [anno]
    min_rows: 100

mart:
  tables:
    - name: "mart_regioni"
      sql: "sql/mart.sql"
  validate:
    table_rules:
      mart_regioni: { min_rows: 21 }

validation:
  fail_on_error: true
