root: "../../out"
schema_version: 1

dataset:
  name: "senato_ddl"
  source_id: "dati_senato"
  tags: [politica, senato, ddl, iter-legislativo]
  category: politica
  years: [2026]
  time_coverage:
    start_year: 2013
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "senato_ddl_sparql"
      type: "sparql"
      primary: true
      args:
        endpoint: "https://dati.senato.it/sparql"
        query: |
          PREFIX osr: <http://dati.senato.it/osr/>
          SELECT ?ddl (MAX(?idDdl) AS ?idDdl) (MAX(?titolo) AS ?titolo)
                 (MAX(?stato) AS ?stato) (MAX(?data) AS ?data)
                 (MAX(?natura) AS ?natura) (MAX(?fase) AS ?fase)
                 (MAX(?ramo) AS ?ramo) (MAX(?iniziativa) AS ?iniziativa)
                 (MAX(?progIter) AS ?progIter) (MAX(?legislatura) AS ?legislatura)
                 (MAX(?numLegge) AS ?numLegge) (MAX(?dataLegge) AS ?dataLegge)
          WHERE {
            GRAPH <http://dati.senato.it/ddl/19> {
              ?ddl osr:idDdl ?idDdl .
              OPTIONAL { ?ddl osr:titolo ?titolo . }
              OPTIONAL { ?ddl osr:statoDdl ?stato . }
              OPTIONAL { ?ddl osr:dataPresentazione ?data . }
              OPTIONAL { ?ddl osr:natura ?natura . }
              OPTIONAL { ?ddl osr:fase ?fase . }
              OPTIONAL { ?ddl osr:ramo ?ramo . }
              OPTIONAL { ?ddl osr:iniziativa ?iniziativa . }
              OPTIONAL { ?ddl osr:progressivoIter ?progIter . }
              OPTIONAL { ?ddl osr:legislatura ?legislatura . }
              OPTIONAL { ?ddl osr:numeroLegge ?numLegge . }
              OPTIONAL { ?ddl osr:dataLegge ?dataLegge . }
            }
          }
          GROUP BY ?ddl
        accept_format: "sparql-results+json"

clean:
  sql: "sql/clean.sql"
  read_mode: robust
  required_columns: [id_ddl, ddl_url, titolo, stato, data_presentazione, natura, fase, ramo, iniziativa, progressivo_iter, legislatura, numero_legge, data_legge]
  read:
    source: auto
    mode: latest
    header: true
    encoding: "utf-8"
    strict_mode: false
    ignore_errors: true
    trim_whitespace: true
  validate:
    not_null: [id_ddl]
    min_rows: 1000
    # una riga = una versione dell'atto nell'iter (ddl × ramo/numero atto)
    primary_key: [id_ddl, fase]

mart:
  tables:
    # DDL per stato (distribuzione dell'iter)
    - name: "mart_stato"
      sql: "sql/mart_stato.sql"
    # DDL per anno di presentazione
    - name: "mart_anno"
      sql: "sql/mart_anno.sql"
  required_tables:
    - "mart_stato"
    - "mart_anno"
  validate:
    table_rules:
      mart_stato:
        required_columns: [stato, n_ddl]
        primary_key: [stato]
        min_rows: 5
      mart_anno:
        required_columns: [anno, n_ddl]
        primary_key: [anno]
        min_rows: 5

validation:
  fail_on_error: false
