# Domande e decisioni di protezione internazionale in Italia (2008-2025)
# Fonte: Eurostat — MIGR_ASYAPPCTZA (domande) + MIGR_ASYDCFSTA (decisioni)
# Issue intake: #597
# Nota: il portale CNA (asylum-opendata.dlci.interno.it) non espone piu' dati
# (vhost placeholder, 404 su tutti i path, nessun archivio) — vedi notes.md.
# Due dataflow con dimensioni diverse -> preprocess.py li normalizza in un CSV unico.

root: "../../out"
schema_version: 1

dataset:
  name: "richiedenti_asilo_italia"
  source_id: "eurostat"
  tags: [immigrazione, asilo, protezione-internazionale, richiedenti-asilo]
  category: immigrazione
  years: [2026]
  # Lo script scarica l'intera serie: se Eurostat pubblica un nuovo anno va
  # aggiornato end_year, altrimenti il metadato resta indietro rispetto ai dati.
  time_coverage:
    mode: "full_series"
    start_year: 2008
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "eurostat_asilo"
      type: "script"
      client:
        timeout: 600
      args:
        command: "python preprocess.py {year} raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  required_columns:
    - anno
    - cittadinanza_codice
    - cittadinanza
    - misura
    - dettaglio_codice
    - dettaglio
    - valore
    - aggregato
  validate:
    not_null: [anno, cittadinanza_codice, misura, dettaglio_codice, valore]
    primary_key: [anno, cittadinanza_codice, misura, dettaglio_codice]
    min_rows: 10000

mart:
  tables:
    - name: "mart_asilo_annuale"
      sql: "sql/mart_asilo_annuale.sql"
    - name: "mart_asilo_italia"
      sql: "sql/mart_asilo_italia.sql"
  required_tables:
    - "mart_asilo_annuale"
    - "mart_asilo_italia"
  validate:
    table_rules:
      mart_asilo_annuale:
        required_columns:
          - anno
          - cittadinanza_codice
          - cittadinanza
          - domande
          - domande_reiterate
          - reiterate_derivate
          - decisioni
          - accolte
          - dinieghi
          - tasso_riconoscimento
        primary_key: [anno, cittadinanza_codice]
        min_rows: 2000
      mart_asilo_italia:
        required_columns:
          - anno
          - domande
          - domande_reiterate
          - reiterate_derivate
          - decisioni
          - accolte
          - dinieghi
          - tasso_riconoscimento
        primary_key: [anno]
        min_rows: 15

validation:
  fail_on_error: true
