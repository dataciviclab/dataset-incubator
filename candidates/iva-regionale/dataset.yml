# Auto-generated by toolkit, manually adjusted for MEF CSV source
root: "../../out"
schema_version: 1

dataset:
  name: "iva_regionale"
  source_id: "mef_finanze"
  tags: [finanza-pubblica, iva, regionale]
  category: finanza-pubblica
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  # 2009-2014 disponibili ma con schema colonne diverso (v1)
  time_coverage: {start_year: 2014, end_year: 2023}

raw:
  output_policy: overwrite
  sources:
    - name: "mef_finanze_iva_regione"
      type: http_file
      args:
        url: "https://www1.finanze.gov.it/finanze/analisi_stat/public/index.php?tree={year}CIVATOT0201&export=3"
        filename: "iva_regionale_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, regione, cod_regione, contribuenti, volume_frequenza, volume_affari_eur, acquisti_frequenza, acquisti_eur, va_frequenza, va_fiscale_eur, imposta_dovuta_frequenza, imposta_dovuta_eur, imposta_credito_frequenza, imposta_credito_eur]
  read:
    source: auto
    mode: latest
    skip: 9
    delim: ";"
    encoding: "utf-8"
    header: true
    # Numeri in formato italiano (punti migliaia, virgola decimale):
    # lo sniffing produce VARCHAR, normalizzati con le macro nel clean.sql
    strict_mode: false
    ignore_errors: true
    null_padding: true
  validate:
    not_null: [anno, regione]
    min_rows: 20
    primary_key: [anno, regione]
    promotion:
      max_row_drop_pct: 50
      fail_on_row_drop_exceeded: false

mart:
  tables:
    # Regione x anno con quota % e rank sul volume nazionale.
    # PER-ANNO (workaround toolkit #445): il benchmark è calcolato dentro
    # la stessa query sull'anno corrente; una tabella per-anno mantiene
    # has_single_year_mart=True così il run passa e il multi-year parte.
    - name: "mart_regioni_anno"
      sql: "sql/mart_regioni_anno.sql"
    # Sintesi nazionale per anno con delta vs anno precedente (multi-year)
    - name: "mart_sintesi_nazionale"
      sql: "sql/mart_sintesi_nazionale.sql"
      years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    # Trend per regione (primo vs ultimo anno della serie) (multi-year)
    - name: "mart_trend_regioni"
      sql: "sql/mart_trend_regioni.sql"
      years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  required_tables:
    - "mart_regioni_anno"
    - "mart_sintesi_nazionale"
  validate:
    table_rules:
      mart_regioni_anno:
        required_columns: [anno, regione, contribuenti, volume_frequenza, volume_affari_eur, va_frequenza, va_fiscale_eur, imposta_credito_frequenza, quota_volume_pct]
        primary_key: [anno, regione]
        min_rows: 20
      mart_sintesi_nazionale:
        required_columns: [anno, contribuenti, volume_affari_eur, va_fiscale_eur, imposta_credito_frequenza, delta_volume_pct]
        primary_key: [anno]
        min_rows: 10
      mart_trend_regioni:
        required_columns: [regione, delta_volume_eur, delta_volume_pct, delta_contribuenti_pct, delta_frequenza_pct]
        primary_key: [regione]
        min_rows: 20

validation:
  fail_on_error: true
