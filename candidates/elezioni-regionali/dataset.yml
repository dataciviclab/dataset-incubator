root: "../../out"
schema_version: 1

dataset:
  name: "elezioni_regionali"
  source_id: "eligendo"
  tags: [politica, elezioni]
  category: politica
  years: [2018, 2019, 2020, 2021, 2023, 2024]

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python preprocess.py {year} raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [data_elezione, regione, circoscrizione, provincia, comune, candidato, lista]
  read:
    mode: latest
    source: auto
    delim: ";"
    encoding: "utf-8"
    header: true
    strict_mode: false
    ignore_errors: true
  validate:
    not_null: [data_elezione]
    min_rows: 100

mart:
  tables:
    - name: "mart_voti_lista_comune"
      sql: "sql/mart.sql"
  validate:
    table_rules:
      mart_voti_lista_comune:
        min_rows: 100

validation:
  fail_on_error: true
