root: "../../out"
schema_version: 1

dataset:
  name: "istat_trasporto_marittimo"
  source_id: "istat_dbnomics"
  tags: [trasporti, marittimo, porti, merci, istat, dbnomics]
  category: trasporti
  years: [2026]
  time_coverage:
    start_year: 2010
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "istat_dbnomics_marittimo"
      type: "dbnomics"
      client:
        timeout: 240
        retries: 2
      args:
        provider: ISTAT
        dataset: "121_393"
        page_size: 1000
        max_pages: 1
        filename: "istat_marittimo_series.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, regione_sbarco, merce_nst, valore]
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    not_null: [anno]
    min_rows: 100

mart:
  tables:
    - name: "mart_porti_regione"
      sql: "sql/mart_porti_regione.sql"
  required_tables:
    - "mart_porti_regione"
  validate:
    table_rules:
      mart_porti_regione:
        required_columns: [regione_sbarco, unita, osservazioni, primo, ultimo]
        min_rows: 5
        primary_key: [regione_sbarco, unita]

validation:
  fail_on_error: true

registry:
  theme: "Trasporto marittimo per regione di sbarco e merceologia"
  dimensions: ["MAR_REG_UNLOADING", "GOODS_TRANSPORT_NST_2007"]
  description: "ISTAT 121_393 via DBnomics — profilo"
