root: "../../out"
schema_version: 1

dataset:
  name: "anac_cup"
  source_id: "anac"
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2026

raw:
  sources:
    - name: "cup"
      type: "ckan"
      extractor:
        type: "unzip_first_csv"
      client:
        user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      args:
        portal_url: "https://dati.gov.it/opendata"
        dataset_id: "cup"
        resource_name: "cup_csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - "cig"
    - "cup"
  read:
    source: config_only
    mode: all
    header: true
    delim: ";"
    encoding: "utf-8"
    quote: '"'
    escape: '"'
    null_padding: true
    trim_whitespace: true
    sample_size: -1
  validate:
    not_null:
      - "cig"
      - "cup"
    min_rows: 1000000

mart:
  tables:
    - name: "mart_cup"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_cup"

validation:
  fail_on_error: true
