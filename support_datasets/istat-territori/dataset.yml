root: "../../out"
schema_version: 1

dataset:
  name: "istat_territori"
  source_id: "istat_sdmx"
  tags: [pa, istat, territori, codelist]
  category: pa
  years: [2026]

# Codelist territoriale ISTAT (CL_ITTER107), support condiviso.
# Fonte: SDMX codelist ISTAT (esploradati.istat.it/SDMXWS/rest/codelist/IT1/CL_ITTER107).
# Il livello e' codificato nella forma del codice (gerarchia standard ISTAT):
#   IT -> nazionale | IT[C-G] -> ripartizione | IT[C-G][1-9] -> regione |
#   IT[C-G][1-9][1-9] o IT[0-9]{3} -> provincia | [0-9]{6} -> comune
# Tutto il resto (macro-aree ITCD/ITFG, ITDA, ITZ, IT_C, "00", ...) -> aggregato:
# sono voci NON standard/sovrapposte, escluse dalle somme per livello.

raw:
  output_policy: overwrite
  sources:
    - name: "istat_territori"
      type: "local_file"
      args:
        path: "raw/istat_territori_raw.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
    header: true
    delim: ","
    encoding: "utf-8"
  required_columns: [ref_area, nome, livello]
  validate:
    not_null: [ref_area, nome, livello]
    min_rows: 1000

mart:
  tables:
    - name: "mart_territori"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_territori"
  validate:
    table_rules:
      mart_territori:
        required_columns: [ref_area, nome, livello]
        not_null: [ref_area, nome, livello]
        min_rows: 1000

validation:
  fail_on_error: true
