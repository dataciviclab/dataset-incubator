root: "../../out"
schema_version: 1

dataset:
  name: "anac_collaudo"
  source_id: "anac"
  tags: [appalti, anac, collaudo]
  category: appalti
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2026

raw:
  sources:
    - name: "collaudo"
      type: "ckan"
      extractor:
        type: "unzip_first_csv"
      client:
        user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
      args:
        portal_url: "https://dati.gov.it/opendata"
        dataset_id: "collaudo"
        resource_name: "collaudo_csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - "cig"
    - "id_aggiudicazione"
  read:
    source: config_only
    mode: all
    header: true
    delim: ";"
    encoding: "utf-8"
    quote: '"'
    escape: '"'
    null_padding: true
    trim_whitespace: true
    sample_size: -1
  validate:
    not_null:
      - "cig"
      - "id_aggiudicazione"
    min_rows: 100000

mart:
  tables:
    - name: "mart_collaudo"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_collaudo"

validation:
  fail_on_error: true
