root: "../../out"
schema_version: 1

dataset:
  name: "camera_incarichi"
  source_id: "dati_camera"
  tags: [politica, camera, incarichi, gruppi-parlamentari]
  category: politica
  years: [2026]
  time_coverage:
    start_year: 1946
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "camera_incarichi_sparql"
      type: "sparql"
      primary: true
      args:
        endpoint: "https://dati.camera.it/sparql"
        query: |
          PREFIX ocd: <http://dati.camera.it/ocd/>
          PREFIX dc: <http://purl.org/dc/elements/1.1/>
          SELECT ?incarico (MAX(?ruolo) AS ?ruolo) (MAX(?label) AS ?label)
                 (MAX(?deputato) AS ?deputato) (MAX(?gruppo) AS ?gruppo)
                 (MAX(?legislatura) AS ?legislatura)
                 (MAX(?start) AS ?start) (MAX(?end) AS ?end)
          WHERE {
            ?incarico a ocd:incarico .
            OPTIONAL { ?incarico ocd:ruolo ?ruolo . }
            OPTIONAL { ?incarico dc:title ?label . }
            OPTIONAL { ?incarico ocd:rif_deputato ?deputato . }
            OPTIONAL { ?incarico ocd:rif_gruppoParlamentare ?gruppo . }
            OPTIONAL { ?incarico ocd:rif_leg ?legislatura . }
            OPTIONAL { ?incarico ocd:startDate ?start . }
            OPTIONAL { ?incarico ocd:endDate ?end . }
          }
          GROUP BY ?incarico
        accept_format: "sparql-results+json"

clean:
  sql: "sql/clean.sql"
  required_columns: [incarico, ruolo, label, deputato, persona_id, gruppo, legislatura, start_date, end_date]
  read:
    source: auto
    mode: latest
    header: true
    encoding: "utf-8"
    strict_mode: false
    ignore_errors: true
    trim_whitespace: true
  validate:
    not_null: [incarico, deputato]
    # volume reale 3.096 incarichi (2026) — margine ~35% di perdita tollerato
    min_rows: 2000
    primary_key: [incarico]

mart:
  tables:
    # Ruoli per legislatura (distribuzione incarichi nel tempo)
    - name: "mart_ruoli_legislatura"
      sql: "sql/mart_ruoli_legislatura.sql"
    # Top deputati per numero di incarichi
    - name: "mart_top_deputati"
      sql: "sql/mart_top_deputati.sql"
  required_tables:
    - "mart_ruoli_legislatura"
    - "mart_top_deputati"
  validate:
    table_rules:
      mart_ruoli_legislatura:
        required_columns: [legislatura, n_incarichi, n_gruppi]
        primary_key: [legislatura]
        min_rows: 10
      mart_top_deputati:
        required_columns: [deputato, n_incarichi, n_gruppi]
        primary_key: [deputato]
        min_rows: 500

validation:
  fail_on_error: true
