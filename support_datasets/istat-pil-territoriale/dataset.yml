root: "../../out"
schema_version: 1

dataset:
  name: "istat_pil_territoriale"
  source_id: "istat_sdmx"
  tags: [economia, istat, pil, territoriale]
  category: economia
  # Anno del run (non la copertura dati).
  # Copertura: nazionale/macro-aree/regioni 1995-2024 (edizione 2025M12),
  # province dal 2000 (ultima edizione disponibile sul canale SDMX).
  years: [2024]
  time_coverage:
    start_year: 1995
    end_year: 2024

# PIL/VA/imposte lato offerta — ISTAT 93_498 via type: sdmx (canale diretto)
# Remigrazione post-fix toolkit key SDMX (#444): il mirror dbnomics era
# un'edizione indietro (2025M6, max 2023) — issue #873 audit.
# Solo 3 metriche ESA: B1GQ, B1G, D21X31 · prezzi correnti V · grezzi N
# EDITION non filtrata: il clean prende max edizione per territorio × metrica.

raw:
  output_policy: overwrite
  sources:
    - name: "istat_sdmx_pil"
      type: "sdmx"
      client:
        timeout: 180
        retries: 2
      args:
        agency: "IT1"
        flow: "93_498"
        version: "1.0"
        filters:
          FREQ: "A"
          DATA_TYPE_AGGR: ["B1GQ_B_W2_S1", "B1G_B_W2_S1", "D21X31_C_W2_S1"]
          VALUATION: "V"
          ADJUSTMENT: "N"
        filename: "istat_pil_territoriale_series.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - territorio_codice
    - territorio_nome
    - livello
    - tipo_dato_codice
    - valutazione_codice
    - anno
    - valore_mln_eu
  read:
    source: "auto"
    mode: "latest"
    delim: ","
    encoding: "utf-8"
    header: true
  validate:
    min_rows: 500

mart:
  tables:
    - name: "pil_territoriale"
      sql: "sql/mart.sql"
  required_tables:
    - "pil_territoriale"
  validate:
    table_rules:
      pil_territoriale:
        min_rows: 500

validation:
  fail_on_error: true
